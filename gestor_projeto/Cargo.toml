[package]
name = "gestor_projeto"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = {version = "1.52.3", features = ["full"]}

serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"

uuid = {version = "1.23.2", features = ["v4", "serde"]}

sqlx = {version = "0.8.6", features = ["runtime-tokio-rustls",
    "mysql",
    "uuid",
    "chrono"
]}

chrono = {version = "0.4.45", features = ["serde"]}

dotenv = "0.15.0"

tower = "0.5.3"
tower-http = {version = "0.6.11", features = ["trace"]}

tracing = "0.1.44"
tracing-subscriber = "0.3.23"